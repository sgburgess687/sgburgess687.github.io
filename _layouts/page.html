---
layout: default
---
<article>
  <header class="section section--tight">
    <div class="container container--narrow">
      {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.lede %}<p class="lede" style="max-width: 60ch;">{{ page.lede }}</p>{% endif %}
    </div>
  </header>
  {{ content }}
</article>
